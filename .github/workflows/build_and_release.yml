name: 🚀 VK Z Build & Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Название версии (например v1.0.1)'
        required: true
        default: 'v1.0.0'
        type: string
      release_title:
        description: 'Заголовок релиза'
        required: true
        default: 'VK Z - Новый релиз'
        type: string
      release_notes:
        description: 'Описание релиза (что нового)'
        required: true
        default: '• Исправлены баги\n• Улучшена производительность'
        type: string
      release_type:
        description: 'Тип релиза'
        required: true
        default: 'prerelease'
        type: choice
        options:
          - prerelease
          - release
      send_telegram:
        description: 'Отправить уведомление в Telegram?'
        required: true
        default: true
        type: boolean

  push:
    branches: [ "main", "release/**" ]
    tags: [ "v*" ]

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.3'
  APP_NAME: 'VK Z'

jobs:
  # ============================================
  # 1. АНАЛИЗ КОДА
  # ============================================
  analyze:
    name: 🔍 Анализ кода
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v3
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Configure Flutter
        run: |
          flutter config --no-analytics --no-cli-animations
          flutter pub get

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test

  # ============================================
  # 2. СБОРКА ANDROID
  # ============================================
  build-android:
    name: 📱 Сборка Android
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v3
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configure Flutter
        run: |
          flutter config --no-analytics --no-cli-animations
          flutter pub get

      - name: Generate icons
        run: dart run flutter_launcher_icons || true

      - name: Build APK (Release)
        run: flutter build apk --release --split-per-abi

      - name: Build AppBundle (AAB)
        run: flutter build appbundle --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          compression-level: 0
          if-no-files-found: warn

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/*.aab
          compression-level: 0
          if-no-files-found: warn

  # ============================================
  # 3. СБОРКА WINDOWS (опционально)
  # ============================================
  build-windows:
    name: 🪟 Сборка Windows
    needs: analyze
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v3
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Configure Flutter
        run: |
          flutter config --no-analytics --no-cli-animations
          flutter pub get

      - name: Generate icons
        run: dart run flutter_launcher_icons || true

      - name: Build Windows (Release)
        run: flutter build windows --release

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version_name }}"
          if (-not $version) { $version = "latest" }
          
          # Try different possible build output paths
          $paths = @(
            "build\windows\x64\runner\Release",
            "build\windows\runner\Release",
            "build\windows\Release"
          )
          
          $found = $false
          foreach ($dir in $paths) {
            if (Test-Path $dir) {
              Write-Host "Found build output at: $dir"
              $items = Get-ChildItem -Path "$dir\*" -File
              if ($items.Count -gt 0) {
                Compress-Archive -Path "$dir\*" -DestinationPath "vk_z_windows_$version.zip" -ErrorAction Stop
                Write-Host "Created archive: vk_z_windows_$version.zip"
                $found = $true
                break
              } else {
                Write-Host "Directory $dir exists but is empty, trying next path..."
              }
            } else {
              Write-Host "Path not found: $dir"
            }
          }
          
          if (-not $found) {
            Write-Host "Searching for any build output..."
            $exeFiles = Get-ChildItem -Path "build\windows" -Recurse -Filter "*.exe" -File -ErrorAction SilentlyContinue
            if ($exeFiles.Count -gt 0) {
              $dir = $exeFiles[0].DirectoryName
              Write-Host "Found EXE at: $dir, using this as build output"
              Compress-Archive -Path "$dir\*" -DestinationPath "vk_z_windows_$version.zip" -ErrorAction Stop
              Write-Host "Created archive: vk_z_windows_$version.zip"
              $found = $true
            } else {
              Get-ChildItem -Path "build\windows" -Recurse -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  Found: $($_.FullName)" }
              Write-Host "No EXE found. Windows build may have failed."
            }
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: vk_z_windows_*.zip
          compression-level: 0
          if-no-files-found: warn

  # ============================================
  # 4. СОЗДАНИЕ РЕЛИЗА
  # ============================================
  release:
    name: 📦 Создание релиза
    needs: [build-android, build-windows]
    # Запускается только при workflow_dispatch или при пуше тега v*
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release_files
          if [ -d "artifacts" ]; then
            # v4 download-artifact creates subdirectories per artifact name
            find artifacts -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.zip" \) -exec cp {} release_files/ \; 2>/dev/null || true
          fi
          echo "=== Release files ==="
          ls -la release_files/ || echo "No release files found"

      - name: Generate release body
        run: |
          VERSION="${{ github.event.inputs.version_name }}"
          TITLE="${{ github.event.inputs.release_title }}"
          NOTES="${{ github.event.inputs.release_notes }}"
          # On push events (tag), use git tag info
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME}"
            TITLE="VK Z ${VERSION}"
            NOTES="Автоматическая сборка"
          fi
          cat > release_body.md << BODYEOF
          ## ${TITLE}

          ### 📋 Что нового:
          ${NOTES}

          ---

          ### 📱 Скачать:

          | Платформа | Файл |
          |-----------|------|
          | 📱 Android (ARM64) | \`app-arm64-v8a-release.apk\` |
          | 📱 Android (ARM32) | \`app-armeabi-v7a-release.apk\` |
          | 📱 Android (x86_64) | \`app-x86_64-release.apk\` |
          | 📦 Android (Bundle) | \`app-release.aab\` |
          | 🪟 Windows | \`vk_z_windows_\${VERSION}.zip\` |

          ---

          *Собрано автоматически через GitHub Actions*
          BODYEOF
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_name || github.ref_name }}
          name: ${{ github.event.inputs.release_title || format('VK Z {0}', github.ref_name) }}
          body_path: release_body.md
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' || startsWith(github.ref_name, 'v') == false }}
          files: release_files/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # 5. УВЕДОМЛЕНИЕ В TELEGRAM
  # ============================================
  notify-telegram:
    name: 📱 Уведомление в Telegram
    needs: [release]
    if: ${{ always() && needs.release.result == 'success' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Check Telegram secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "telegram_configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ Telegram secrets not configured. Skipping notification."
          else
            echo "telegram_configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        if: steps.check_secrets.outputs.telegram_configured == 'true'
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Debug artifacts
        if: steps.check_secrets.outputs.telegram_configured == 'true'
        shell: bash
        run: |
          echo "=== Artifacts directory ==="
          find artifacts -type f 2>/dev/null || echo "No files found"
          echo "=== Directory structure ==="
          ls -laR artifacts/ 2>/dev/null || echo "No artifacts dir"

      - name: Send message + files to Telegram
        if: steps.check_secrets.outputs.telegram_configured == 'true'
        shell: bash
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ github.event.inputs.version_name || github.ref_name }}
          TITLE: ${{ github.event.inputs.release_title || format('VK Z {0}', github.ref_name) }}
          NOTES: ${{ github.event.inputs.release_notes || 'Автоматическая сборка' }}
          REPO: ${{ github.repository }}
          APP_NAME: ${{ env.APP_NAME }}
        run: |
          # Build message with printf to handle multi-line properly
          MESSAGE_TEXT=$(printf "%s\n\n📦 Версия: %s\n📝 Название: %s\n\n📋 Что нового:\n%s\n\n🔗 Скачать: https://github.com/%s/releases/tag/%s\n\n⚡ Собрано автоматически через GitHub Actions" \
            "${APP_NAME} — новый релиз" \
            "${VERSION}" \
            "${TITLE}" \
            "${NOTES}" \
            "${REPO}" \
            "${VERSION}")

          # Send text message (no parse_mode = plain text, avoids formatting issues)
          echo "Sending text message..."
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE_TEXT}" \
            -d "disable_web_page_preview=true" && echo " ✅ Text sent" || echo " ❌ Text failed"

          # Send files
          echo "--- Sending files ---"
          if [ -d "artifacts" ]; then
            # Send all APK, AAB, and ZIP files
            find artifacts -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.zip" \) 2>/dev/null | while read file; do
              filename=$(basename "$file")
              filesize=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null || echo "?")
              echo "Uploading: $filename (${filesize} bytes)"
              
              RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${file}" \
                -F "caption=${filename} — ${APP_NAME} ${VERSION}" 2>&1)
              
              if echo "$RESPONSE" | grep -q '"ok":true'; then
                echo " ✅ $filename sent"
              else
                echo " ❌ $filename failed: $RESPONSE"
              fi
            done
          else
            echo "No artifacts directory found, skipping file uploads"
          fi

          echo "✅ Done!"