name: 🚀 VK Z Build & Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Название версии (например v1.0.1)'
        required: true
        default: 'v1.0.0'
        type: string
      release_title:
        description: 'Заголовок релиза'
        required: true
        default: 'VK Z - Новый релиз'
        type: string
      release_notes:
        description: 'Описание релиза (что нового)'
        required: true
        default: '• Исправлены баги\n• Улучшена производительность'
        type: string
      release_type:
        description: 'Тип релиза'
        required: true
        default: 'prerelease'
        type: choice
        options:
          - prerelease
          - release
      send_telegram:
        description: 'Отправить уведомление в Telegram?'
        required: true
        default: true
        type: boolean

  push:
    branches: [ "main", "release/**" ]
    tags: [ "v*" ]

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.3'
  APP_NAME: 'VK Z'

jobs:
  # ============================================
  # 1. АНАЛИЗ КОДА
  # ============================================
  analyze:
    name: 🔍 Анализ кода
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Configure Flutter
        run: |
          flutter config --no-analytics --no-cli-animations
          flutter pub get

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test

  # ============================================
  # 2. СБОРКА ANDROID
  # ============================================
  build-android:
    name: 📱 Сборка Android
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configure Flutter
        run: |
          flutter config --no-analytics --no-cli-animations
          flutter pub get

      - name: Generate icons
        run: dart run flutter_launcher_icons || true

      - name: Build APK (Release)
        run: flutter build apk --release --split-per-abi

      - name: Build AppBundle (AAB)
        run: flutter build appbundle --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          compression-level: 0

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/*.aab
          compression-level: 0

  # ============================================
  # 3. СБОРКА WINDOWS (опционально)
  # ============================================
  build-windows:
    name: 🪟 Сборка Windows
    needs: analyze
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Configure Flutter
        run: |
          flutter config --no-analytics --no-cli-animations
          flutter pub get

      - name: Generate icons
        run: dart run flutter_launcher_icons || true

      - name: Build Windows (Release)
        run: flutter build windows --release

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version_name }}"
          if (-not $version) { $version = "latest" }
          
          # Try different possible build output paths
          $paths = @(
            "build\windows\x64\runner\Release",
            "build\windows\runner\Release",
            "build\windows\Release"
          )
          
          $found = $false
          foreach ($dir in $paths) {
            if (Test-Path $dir) {
              Write-Host "Found build output at: $dir"
              $items = Get-ChildItem -Path "$dir\*" -File
              if ($items.Count -gt 0) {
                Compress-Archive -Path "$dir\*" -DestinationPath "vk_z_windows_$version.zip" -ErrorAction Stop
                Write-Host "Created archive: vk_z_windows_$version.zip"
                $found = $true
                break
              } else {
                Write-Host "Directory $dir exists but is empty, trying next path..."
              }
            } else {
              Write-Host "Path not found: $dir"
            }
          }
          
          if (-not $found) {
            Write-Host "Searching for any build output..."
            $exeFiles = Get-ChildItem -Path "build\windows" -Recurse -Filter "*.exe" -File -ErrorAction SilentlyContinue
            if ($exeFiles.Count -gt 0) {
              $dir = $exeFiles[0].DirectoryName
              Write-Host "Found EXE at: $dir, using this as build output"
              Compress-Archive -Path "$dir\*" -DestinationPath "vk_z_windows_$version.zip" -ErrorAction Stop
              Write-Host "Created archive: vk_z_windows_$version.zip"
              $found = $true
            } else {
              Get-ChildItem -Path "build\windows" -Recurse -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  Found: $($_.FullName)" }
              Write-Host "No EXE found. Windows build may have failed."
            }
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: vk_z_windows_*.zip
          compression-level: 0

  # ============================================
  # 4. СОЗДАНИЕ РЕЛИЗА
  # ============================================
  release:
    name: 📦 Создание релиза
    needs: [build-android, build-windows]
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release_files
          if [ -d "artifacts" ]; then
            find artifacts -name "*.apk" -exec cp {} release_files/ \; 2>/dev/null || true
            find artifacts -name "*.aab" -exec cp {} release_files/ \; 2>/dev/null || true
            find artifacts -name "*.zip" -exec cp {} release_files/ \; 2>/dev/null || true
          fi
          echo "=== Release files ==="
          ls -la release_files/ || echo "No release files found"

      - name: Generate release body
        run: |
          cat > release_body.md << BODYEOF
          ## ${{ github.event.inputs.release_title }}

          ### 📋 Что нового:
          ${{ github.event.inputs.release_notes }}

          ---

          ### 📱 Скачать:

          | Платформа | Файл |
          |-----------|------|
          | 📱 Android (ARM64) | \`app-arm64-v8a-release.apk\` |
          | 📱 Android (ARM32) | \`app-armeabi-v7a-release.apk\` |
          | 📱 Android (x86_64) | \`app-x86_64-release.apk\` |
          | 📦 Android (Bundle) | \`app-release.aab\` |
          | 🪟 Windows | \`vk_z_windows_\${{ github.event.inputs.version_name }}.zip\` |

          ---

          *Собрано автоматически через GitHub Actions*
          BODYEOF

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version_name }}
          name: ${{ github.event.inputs.release_title }}
          body_path: release_body.md
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' }}
          files: release_files/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # 5. УВЕДОМЛЕНИЕ В TELEGRAM
  # ============================================
  notify-telegram:
    name: 📱 Уведомление в Telegram
    needs: [build-android, build-windows]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.send_telegram == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check Telegram secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "telegram_configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ Telegram secrets not configured. Skipping notification."
          else
            echo "telegram_configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        if: steps.check_secrets.outputs.telegram_configured == 'true'
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Send message + files to Telegram
        if: steps.check_secrets.outputs.telegram_configured == 'true'
        shell: bash
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ github.event.inputs.version_name }}
          TITLE: ${{ github.event.inputs.release_title }}
          NOTES: ${{ github.event.inputs.release_notes }}
          REPO: ${{ github.repository }}
        run: |
          # Escape markdown special chars for caption
          NOTES_ESCAPED=$(echo "$NOTES" | sed 's/[_*\[\]()~`>#+\-=|{}.!]/\\&/g')
          
          # Send text message first
          MESSAGE="🚀 *${APP_NAME}* — новый релиз%0A%0A"
          MESSAGE+="📦 *Версия:* \`$VERSION\`%0A"
          MESSAGE+="📝 *Название:* $TITLE%0A%0A"
          MESSAGE+="📋 *Что нового:*%0A\`\`\`%0A${NOTES_ESCAPED}%0A\`\`\`%0A%0A"
          MESSAGE+="🔗 *Скачать:* https://github.com/$REPO/releases/tag/$VERSION%0A%0A"
          MESSAGE+="⚡ Собрано автоматически через GitHub Actions"
          
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d "chat_id=$CHAT_ID" \
            -d "text=$MESSAGE" \
            -d "parse_mode=MarkdownV2" \
            -d "disable_web_page_preview=true" > /dev/null

          # Send APK files
          echo "--- Sending APK files ---"
          if [ -d "artifacts" ]; then
            find artifacts -name "*.apk" 2>/dev/null | while read file; do
              filename=$(basename "$file")
              echo "Uploading: $filename"
              curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendDocument" \
                -F "chat_id=$CHAT_ID" \
                -F "document=@$file" \
                -F "caption=📱 *$filename*%0A%0A$APP_NAME $VERSION" \
                -F "parse_mode=MarkdownV2" > /dev/null || echo "Failed to send $filename"
            done

            # Send AAB file
            echo "--- Sending AAB file ---"
            find artifacts -name "*.aab" 2>/dev/null | while read file; do
              filename=$(basename "$file")
              echo "Uploading: $filename"
              curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendDocument" \
                -F "chat_id=$CHAT_ID" \
                -F "document=@$file" \
                -F "caption=📦 *$filename*%0A%0A$APP_NAME $VERSION" \
                -F "parse_mode=MarkdownV2" > /dev/null || echo "Failed to send $filename"
            done

            # Send Windows ZIP
            echo "--- Sending Windows ZIP ---"
            find artifacts -name "*.zip" 2>/dev/null | while read file; do
              filename=$(basename "$file")
              echo "Uploading: $filename"
              curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendDocument" \
                -F "chat_id=$CHAT_ID" \
                -F "document=@$file" \
                -F "caption=🪟 *$filename*%0A%0A$APP_NAME $VERSION" \
                -F "parse_mode=MarkdownV2" > /dev/null || echo "Failed to send $filename"
            done
          else
            echo "No artifacts directory found, skipping file uploads"
          fi

          echo "✅ All files sent to Telegram!"