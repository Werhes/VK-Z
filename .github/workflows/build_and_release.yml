name: Build VK Z

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. v1.0.1)'
        required: true
        default: 'v1.0.6'
        type: string
      release_title:
        description: 'Release title'
        required: true
        default: 'Token fix'
        type: string
      release_notes:
        description: 'Release notes'
        required: true
        default: '- Bug fixes'
        type: string
      release_type:
        description: 'Release type'
        required: true
        default: 'prerelease'
        type: choice
        options:
          - prerelease
          - release
      send_telegram:
        description: 'Send Telegram notification?'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.3'
  APP_NAME: 'VK Z'

jobs:
  # ============================================
  # 1. BUILD ANDROID
  # ============================================
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup-rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: build-rust
        run: |
          cd rust
          cargo install cargo-ndk
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 -o ../android/app/src/main/jniLibs build --release

      - name: setup-flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: configure
        run: |
          flutter config --no-analytics --no-cli-animations
          flutter pub get

      - name: icons
        run: dart run flutter_launcher_icons || true

      - name: build-apk
        run: flutter build apk --release --split-per-abi

      - name: build-aab
        run: flutter build appbundle --release

      - name: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          compression-level: 0
          if-no-files-found: warn

      - name: upload-aab
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/*.aab
          compression-level: 0
          if-no-files-found: warn

  # ============================================
  # 2. BUILD IOS
  # ============================================
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup-rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: build-rust
        run: |
          cd rust
          cargo build --release --target aarch64-apple-ios
          mkdir -p ../ios/Runner
          cp target/aarch64-apple-ios/release/librust_vk_z.a ../ios/Runner/

      - name: setup-flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: setup-cocoapods
        run: |
          gem install cocoapods
          pod setup

      - name: configure
        run: |
          flutter config --no-analytics --no-cli-animations
          flutter pub get

      - name: icons
        run: dart run flutter_launcher_icons || true

      - name: pod-install
        run: |
          cd ios
          pod install

      - name: build-ios
        run: flutter build ios --release --no-codesign

      - name: create-ipa
        run: |
          mkdir -p build/ios/ipa
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r ../../../vk_z_ios_${{ github.event.inputs.version_name || 'latest' }}.ipa Payload/

      - name: upload-ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: vk_z_ios_*.ipa
          compression-level: 0
          if-no-files-found: warn

  # ============================================
  # 3. BUILD WINDOWS
  # ============================================
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: setup-rust
        uses: dtolnay/rust-toolchain@stable

      - name: build-rust
        shell: pwsh
        run: |
          cd rust
          cargo build --release
          copy target\release\rust_vk_z.dll ..\windows\runner\

      - name: setup-flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: configure
        run: |
          flutter config --no-analytics --no-cli-animations
          flutter pub get

      - name: icons
        run: dart run flutter_launcher_icons || true

      - name: build-windows
        run: flutter build windows --release

      - name: create-zip
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version_name }}"
          if (-not $version) { $version = "latest" }
          
          $paths = @(
            "build\windows\x64\runner\Release",
            "build\windows\runner\Release",
            "build\windows\Release"
          )
          
          $found = $false
          foreach ($dir in $paths) {
            if (Test-Path $dir) {
              Write-Host "Found build output at: $dir"
              $items = Get-ChildItem -Path "$dir\*" -File
              if ($items.Count -gt 0) {
                Compress-Archive -Path "$dir\*" -DestinationPath "vk_z_windows_$version.zip" -ErrorAction Stop
                Write-Host "Created archive: vk_z_windows_$version.zip"
                $found = $true
                break
              } else {
                Write-Host "Directory $dir exists but is empty, trying next path..."
              }
            } else {
              Write-Host "Path not found: $dir"
            }
          }
          
          if (-not $found) {
            Write-Host "Searching for any build output..."
            $exeFiles = Get-ChildItem -Path "build\windows" -Recurse -Filter "*.exe" -File -ErrorAction SilentlyContinue
            if ($exeFiles.Count -gt 0) {
              $dir = $exeFiles[0].DirectoryName
              Write-Host "Found EXE at: $dir, using this as build output"
              Compress-Archive -Path "$dir\*" -DestinationPath "vk_z_windows_$version.zip" -ErrorAction Stop
              Write-Host "Created archive: vk_z_windows_$version.zip"
              $found = $true
            } else {
              Get-ChildItem -Path "build\windows" -Recurse -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  Found: $($_.FullName)" }
              Write-Host "No EXE found. Windows build may have failed."
            }
          }

      - name: upload-zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: vk_z_windows_*.zip
          compression-level: 0
          if-no-files-found: warn

  # ============================================
  # 4. BUILD MACOS
  # ============================================
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: setup-rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: build-rust
        run: |
          cd rust
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p target/universal/release
          lipo -create \
            target/aarch64-apple-darwin/release/librust_vk_z.dylib \
            target/x86_64-apple-darwin/release/librust_vk_z.dylib \
            -output target/universal/release/librust_vk_z.dylib
          cp target/universal/release/librust_vk_z.dylib ../macos/Runner/

      - name: setup-flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: configure
        run: |
          flutter config --no-analytics --no-cli-animations
          flutter pub get

      - name: icons
        run: dart run flutter_launcher_icons || true

      - name: build-macos
        id: build_macos
        run: flutter build macos --release

      - name: debug-output
        if: always()
        run: |
          echo "=== Checking build/macos structure ==="
          if [ -d "build/macos" ]; then
            echo "build/macos exists. Top-level contents:"
            ls -la build/macos/
            echo ""
            echo "=== Recursive listing of build/macos/Build ==="
            if [ -d "build/macos/Build" ]; then
              find build/macos/Build -maxdepth 4 -type d 2>/dev/null || echo "find failed"
            else
              echo "No Build/ directory inside build/macos"
            fi
          else
            echo "build/macos directory does not exist!"
            echo "Contents of build/ directory:"
            ls -la build/ 2>/dev/null || echo "build/ directory not found"
          fi

      - name: create-zip
        run: |
          VERSION="${{ github.event.inputs.version_name || 'latest' }}"
          echo "Creating macOS ZIP archive for version: $VERSION"
          
          APP_DIR="build/macos/Build/Products/Release"
          for app_name in "vk_z.app" "Runner.app"; do
            if [ -d "$APP_DIR" ] && [ -d "$APP_DIR/$app_name" ]; then
              echo "Found $app_name at $APP_DIR/$app_name"
              cd "$APP_DIR"
              zip -r "$GITHUB_WORKSPACE/vk_z_macos_${VERSION}.zip" "$app_name"
              echo "ZIP created successfully"
              exit 0
            fi
          done
          
          echo "Strategy 1 failed. Trying Strategy 2: searching build/macos recursively..."
          APP_BUNDLE=$(find build/macos -name "*.app" -type d -maxdepth 6 2>/dev/null | head -1)
          if [ -n "$APP_BUNDLE" ]; then
            echo "Found app bundle at: $APP_BUNDLE"
            cd "$(dirname "$APP_BUNDLE")"
            zip -r "$GITHUB_WORKSPACE/vk_z_macos_${VERSION}.zip" "$(basename "$APP_BUNDLE")"
            echo "ZIP created successfully"
            exit 0
          fi
          
          echo "Strategy 2 failed. Trying Strategy 3: searching entire filesystem..."
          APP_BUNDLE=$(find / -name "*.app" -type d -maxdepth 8 -not -path "*/Xcode*" -not -path "*/Simulator*" -not -path "*/Applications/*" 2>/dev/null | head -1)
          if [ -n "$APP_BUNDLE" ]; then
            echo "Found app bundle at: $APP_BUNDLE"
            cd "$(dirname "$APP_BUNDLE")"
            zip -r "$GITHUB_WORKSPACE/vk_z_macos_${VERSION}.zip" "$(basename "$APP_BUNDLE")"
            echo "ZIP created successfully"
            exit 0
          fi
          
          echo "No .app bundle found anywhere!"
          echo "=== Full build/macos directory tree ==="
          if [ -d "build/macos" ]; then
            find build/macos -maxdepth 6 -type d 2>/dev/null
          else
            echo "build/macos directory does not exist"
            ls -la build/ 2>/dev/null || echo "build/ directory not found"
          fi
          exit 1

      - name: upload-zip
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: vk_z_macos_*.zip
          compression-level: 0
          if-no-files-found: warn

  # ============================================
  # 5. BUILD LINUX
  # ============================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: setup-rust
        uses: dtolnay/rust-toolchain@stable

      - name: build-rust
        run: |
          cd rust
          cargo build --release
          cp target/release/librust_vk_z.so ../linux/flutter/

      - name: setup-flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: install-deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: configure
        run: |
          flutter config --no-analytics --no-cli-animations
          flutter pub get

      - name: icons
        run: dart run flutter_launcher_icons || true

      - name: build-linux
        run: flutter build linux --release

      - name: create-zip
        run: |
          BUNDLE_DIR="build/linux/x64/release/bundle"
          if [ -d "$BUNDLE_DIR" ]; then
            cd "$BUNDLE_DIR"
            zip -r "$GITHUB_WORKSPACE/vk_z_linux_${{ github.event.inputs.version_name || 'latest' }}.zip" .
          else
            echo "Linux bundle not found at $BUNDLE_DIR"
            ls -la build/linux/ 2>/dev/null || echo "build/linux directory not found"
            exit 1
          fi

      - name: upload-zip
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: vk_z_linux_*.zip
          compression-level: 0
          if-no-files-found: warn

  # ============================================
  # 6. CREATE RELEASE
  # ============================================
  release:
    name: Create Release
    needs: [build-android, build-ios, build-windows, build-macos, build-linux]
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: download-artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: prepare-files
        run: |
          mkdir -p release_files
          if [ -d "artifacts" ]; then
            find artifacts -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.ipa" -o -name "*.zip" \) -exec cp {} release_files/ \; 2>/dev/null || true
          fi
          echo "=== Release files ==="
          ls -la release_files/ || echo "No release files found"

      - name: generate-body
        run: |
          VERSION="${{ github.event.inputs.version_name }}"
          TITLE="${{ github.event.inputs.release_title }}"
          NOTES="${{ github.event.inputs.release_notes }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME}"
            TITLE="VK Z ${VERSION}"
            NOTES="Automatic build"
          fi
          cat > release_body.md << BODYEOF
          ## ${TITLE}

          ### What's new:
          ${NOTES}

          ---

          ### Download:

          | Platform | File |
          |-----------|------|
          | Android (ARM64) | \`app-arm64-v8a-release.apk\` |
          | Android (ARM32) | \`app-armeabi-v7a-release.apk\` |
          | Android (x86_64) | \`app-x86_64-release.apk\` |
          | Android (Bundle) | \`app-release.aab\` |
          | iOS | \`vk_z_ios_\${VERSION}.ipa\` |
          | macOS | \`vk_z_macos_\${VERSION}.zip\` |
          | Linux | \`vk_z_linux_\${VERSION}.zip\` |
          | Windows | \`vk_z_windows_\${VERSION}.zip\` |

          ---

          *Built automatically via GitHub Actions*
          BODYEOF
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_name || github.ref_name }}
          name: ${{ github.event.inputs.release_title || format('VK Z {0}', github.ref_name) }}
          body_path: release_body.md
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' || startsWith(github.ref_name, 'v') == false }}
          files: release_files/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # 7. TELEGRAM NOTIFICATION
  # ============================================
  notify-telegram:
    name: Telegram Notification
    needs: [release]
    if: ${{ always() && needs.release.result == 'success' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest

    steps:
      - name: check-secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "telegram_configured=false" >> $GITHUB_OUTPUT
            echo "Telegram secrets not configured. Skipping notification."
          else
            echo "telegram_configured=true" >> $GITHUB_OUTPUT
          fi

      - name: download-artifacts
        if: steps.check_secrets.outputs.telegram_configured == 'true'
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: debug-artifacts
        if: steps.check_secrets.outputs.telegram_configured == 'true'
        shell: bash
        run: |
          echo "=== Artifacts directory ==="
          find artifacts -type f 2>/dev/null || echo "No files found"
          echo "=== Directory structure ==="
          ls -laR artifacts/ 2>/dev/null || echo "No artifacts dir"

      - name: send-telegram
        if: steps.check_secrets.outputs.telegram_configured == 'true'
        shell: bash
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ github.event.inputs.version_name || github.ref_name }}
          TITLE: ${{ github.event.inputs.release_title || format('VK Z {0}', github.ref_name) }}
          NOTES: ${{ github.event.inputs.release_notes || 'Automatic build' }}
          REPO: ${{ github.repository }}
          APP_NAME: ${{ env.APP_NAME }}
        run: |
          MESSAGE_TEXT=$(printf "%s\n\nVersion: %s\nTitle: %s\n\nWhat's new:\n%s\n\nDownload: https://github.com/%s/releases/tag/%s\n\nBuilt automatically via GitHub Actions" \
            "${APP_NAME} - new release" \
            "${VERSION}" \
            "${TITLE}" \
            "${NOTES}" \
            "${REPO}" \
            "${VERSION}")

          echo "Sending text message..."
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE_TEXT}" \
            -d "disable_web_page_preview=true" && echo "Text sent" || echo "Text failed"

          echo "--- Sending files ---"
          if [ -d "artifacts" ]; then
            find artifacts -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.ipa" -o -name "*.zip" \) 2>/dev/null | while read file; do
              filename=$(basename "$file")
              filesize=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null || echo "?")
              echo "Uploading: $filename (${filesize} bytes)"
              
              RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendDocument" \
                -F "chat_id=${CHAT_ID}" \
                -F "document=@${file}" \
                -F "caption=${filename} - ${APP_NAME} ${VERSION}" 2>&1)
              
              if echo "$RESPONSE" | grep -q '"ok":true'; then
                echo "$filename sent"
              else
                echo "$filename failed: $RESPONSE"
              fi
            done
          else
            echo "No artifacts directory found, skipping file uploads"
          fi

          echo "Done!"