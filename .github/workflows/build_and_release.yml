name: 🚀 VK Z Build & Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Название версии (например v1.0.1)'
        required: true
        default: 'v1.0.0'
        type: string
      release_title:
        description: 'Заголовок релиза'
        required: true
        default: 'VK Z - Новый релиз'
        type: string
      release_notes:
        description: 'Описание релиза (что нового)'
        required: true
        default: '• Исправлены баги\n• Улучшена производительность'
        type: string
      release_type:
        description: 'Тип релиза'
        required: true
        default: 'prerelease'
        type: choice
        options:
          - prerelease
          - release
      send_telegram:
        description: 'Отправить уведомление в Telegram?'
        required: true
        default: true
        type: boolean

  push:
    branches: [ "main", "release/**" ]
    tags: [ "v*" ]

env:
  FLUTTER_VERSION: '3.24.0'
  APP_NAME: 'VK Z'

jobs:
  # ============================================
  # 1. АНАЛИЗ КОДА
  # ============================================
  analyze:
    name: 🔍 Анализ кода
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test || true

  # ============================================
  # 2. СБОРКА ANDROID
  # ============================================
  build-android:
    name: 📱 Сборка Android
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate icons
        run: dart run flutter_launcher_icons || true

      - name: Build APK (Release)
        run: flutter build apk --release --split-per-abi

      - name: Build AppBundle (AAB)
        run: flutter build appbundle --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          compression-level: 0

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/*.aab
          compression-level: 0

  # ============================================
  # 3. СБОРКА WINDOWS
  # ============================================
  build-windows:
    name: 🪟 Сборка Windows
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate icons
        run: dart run flutter_launcher_icons || true

      - name: Build Windows (Release)
        run: flutter build windows --release

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version_name }}"
          if (-not $version) { $version = "latest" }
          Compress-Archive -Path "build\windows\runner\Release\*" -DestinationPath "vk_z_windows_$version.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: vk_z_windows_*.zip
          compression-level: 0

  # ============================================
  # 4. СОЗДАНИЕ РЕЛИЗА
  # ============================================
  release:
    name: 📦 Создание релиза
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release_files
          find artifacts -name "*.apk" -exec cp {} release_files/ \;
          find artifacts -name "*.aab" -exec cp {} release_files/ \;
          find artifacts -name "*.zip" -exec cp {} release_files/ \;
          echo "=== Release files ==="
          ls -la release_files/

      - name: Generate release body
        run: |
          cat > release_body.md << BODYEOF
          ## ${{ github.event.inputs.release_title }}

          ### 📋 Что нового:
          ${{ github.event.inputs.release_notes }}

          ---

          ### 📱 Скачать:

          | Платформа | Файл |
          |-----------|------|
          | 📱 Android (ARM64) | \`app-arm64-v8a-release.apk\` |
          | 📱 Android (ARM32) | \`app-armeabi-v7a-release.apk\` |
          | 📱 Android (x86_64) | \`app-x86_64-release.apk\` |
          | 📦 Android (Bundle) | \`app-release.aab\` |
          | 🪟 Windows | \`vk_z_windows_\${{ github.event.inputs.version_name }}.zip\` |

          ---

          *Собрано автоматически через GitHub Actions*
          BODYEOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_name }}
          name: ${{ github.event.inputs.release_title }}
          body_path: release_body.md
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' }}
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # 5. УВЕДОМЛЕНИЕ В TELEGRAM
  # ============================================
  notify-telegram:
    name: 📱 Уведомление в Telegram
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.send_telegram == 'true'

    steps:
      - name: Check Telegram secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "telegram_configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ Telegram secrets not configured. Skipping notification."
          else
            echo "telegram_configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        if: steps.check_secrets.outputs.telegram_configured == 'true'
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Send message + files to Telegram
        if: steps.check_secrets.outputs.telegram_configured == 'true'
        shell: bash
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ github.event.inputs.version_name }}
          TITLE: ${{ github.event.inputs.release_title }}
          NOTES: ${{ github.event.inputs.release_notes }}
          REPO: ${{ github.repository }}
        run: |
          # Escape markdown special chars for caption
          NOTES_ESCAPED=$(echo "$NOTES" | sed 's/[_*\[\]()~`>#+\-=|{}.!]/\\&/g')
          
          # Send text message first
          MESSAGE="🚀 *${APP_NAME}* — новый релиз%0A%0A"
          MESSAGE+="📦 *Версия:* \`$VERSION\`%0A"
          MESSAGE+="📝 *Название:* $TITLE%0A%0A"
          MESSAGE+="📋 *Что нового:*%0A\`\`\`%0A${NOTES_ESCAPED}%0A\`\`\`%0A%0A"
          MESSAGE+="🔗 *Скачать:* https://github.com/$REPO/releases/tag/$VERSION%0A%0A"
          MESSAGE+="⚡ Собрано автоматически через GitHub Actions"
          
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d "chat_id=$CHAT_ID" \
            -d "text=$MESSAGE" \
            -d "parse_mode=MarkdownV2" \
            -d "disable_web_page_preview=true" > /dev/null

          # Send APK files
          echo "--- Sending APK files ---"
          find artifacts -name "*.apk" | while read file; do
            filename=$(basename "$file")
            echo "Uploading: $filename"
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendDocument" \
              -F "chat_id=$CHAT_ID" \
              -F "document=@$file" \
              -F "caption=📱 *$filename*%0A%0A$APP_NAME $VERSION" \
              -F "parse_mode=MarkdownV2" > /dev/null
          done

          # Send AAB file
          echo "--- Sending AAB file ---"
          find artifacts -name "*.aab" | while read file; do
            filename=$(basename "$file")
            echo "Uploading: $filename"
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendDocument" \
              -F "chat_id=$CHAT_ID" \
              -F "document=@$file" \
              -F "caption=📦 *$filename*%0A%0A$APP_NAME $VERSION" \
              -F "parse_mode=MarkdownV2" > /dev/null
          done

          # Send Windows ZIP
          echo "--- Sending Windows ZIP ---"
          find artifacts -name "*.zip" | while read file; do
            filename=$(basename "$file")
            echo "Uploading: $filename"
            curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendDocument" \
              -F "chat_id=$CHAT_ID" \
              -F "document=@$file" \
              -F "caption=🪟 *$filename*%0A%0A$APP_NAME $VERSION" \
              -F "parse_mode=MarkdownV2" > /dev/null
          done

          echo "✅ All files sent to Telegram!"