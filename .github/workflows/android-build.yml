name: Android CI/CD

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Название версии (например, 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Код версии (число)'
        required: true
        default: '1'
      release_notes:
        description: 'Описание релиза'
        required: false
        default: ''
      release_type:
        description: 'Тип релиза'
        required: true
        default: 'prerelease'
        type: choice
        options:
          - release
          - prerelease

env:
  DOTNET_VERSION: '6.0.x'
  ANDROID_CONFIGURATION: 'Release'
  PROJECT_PATH: 'Werhes.Vkz.AndroidApp/Werhes.Vkz.AndroidApp.csproj'
  APK_OUTPUT_DIR: 'Werhes.Vkz.AndroidApp/bin/Release'

jobs:
  build-android:
    name: Build Android APK
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Xamarin Android workload
        run: dotnet workload install android maui 2>/dev/null || true

      - name: Restore NuGet packages
        run: dotnet restore Werhes.Vkz.sln

      - name: Build Android project (Release)
        run: msbuild ${{ env.PROJECT_PATH }} /t:PackageForAndroid /p:Configuration=${{ env.ANDROID_CONFIGURATION }} /p:AndroidPackageFormat=aab /p:VersionName=${{ github.event.inputs.version_name }} /p:VersionCode=${{ github.event.inputs.version_code }}

      - name: Find APK/AAB file
        id: find_artifact
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Path "${{ env.APK_OUTPUT_DIR }}" -Recurse -Filter "*.aab" | Select-Object -First 1
          if (-not $apk) {
            $apk = Get-ChildItem -Path "${{ env.APK_OUTPUT_DIR }}" -Recurse -Filter "*.apk" | Select-Object -First 1
          }
          if ($apk) {
            echo "artifact_path=$($apk.FullName)" >> $env:GITHUB_OUTPUT
            echo "artifact_name=$($apk.Name)" >> $env:GITHUB_OUTPUT
          } else {
            echo "artifact_path=" >> $env:GITHUB_OUTPUT
            echo "artifact_name=" >> $env:GITHUB_OUTPUT
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VKZ-Android-${{ github.event.inputs.version_name }}
          path: ${{ steps.find_artifact.outputs.artifact_path }}
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.find_artifact.outputs.artifact_path != ''
        with:
          tag_name: android-v${{ github.event.inputs.version_name }}
          name: VK Z Android v${{ github.event.inputs.version_name }}
          body: ${{ github.event.inputs.release_notes }}
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' }}
          files: |
            ${{ steps.find_artifact.outputs.artifact_path }}

      - name: Send Telegram notification
        if: always()
        shell: pwsh
        run: |
          $botToken = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          $chatId = "${{ secrets.TELEGRAM_CHAT_ID }}"
          
          if ([string]::IsNullOrEmpty($botToken) -or [string]::IsNullOrEmpty($chatId)) {
            Write-Host "Telegram secrets not configured, skipping notification"
            exit 0
          }
          
          $status = "${{ job.status }}"
          $versionName = "${{ github.event.inputs.version_name }}"
          $releaseType = "${{ github.event.inputs.release_type }}"
          $runId = "${{ github.run_id }}"
          $repoUrl = "${{ github.server_url }}/${{ github.repository }}"
          
          $emoji = if ($status -eq "success") { "✅" } else { "❌" }
          $statusText = if ($status -eq "success") { "SUCCESS" } else { "FAILED" }
          
          $message = @"
          ${emoji} *Android Build VK Z* ${emoji}
          
          *Status:* ${statusText}
          *Version:* ${versionName}
          *Type:* ${releaseType}
          *Release:* [GitHub Release](${repoUrl}/releases/tag/android-v${versionName})
          *Run:* [Actions Run #${runId}](${repoUrl}/actions/runs/${runId})
          "@
          
          $body = @{
            chat_id = $chatId
            text = $message
            parse_mode = "Markdown"
            disable_web_page_preview = $false
          } | ConvertTo-Json
          
          Invoke-RestMethod -Uri "https://api.telegram.org/bot${botToken}/sendMessage" -Method Post -ContentType "application/json" -Body $body