name: 📱 VK-Z Build All (Android + iOS)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Название версии (например, v1.2.0)'
        required: true
        default: 'v1.0.0'
        type: string
      release_notes:
        description: 'Описание релиза (что нового)'
        required: true
        default: 'Исправления и улучшения'
        type: string
      is_prerelease:
        description: 'Pre-release (черновик)?'
        required: true
        default: true
        type: boolean

env:
  APP_NAME: 'VK-Z'
  APK_OUTPUT_NAME: 'VK-Z-Universal.apk'
  IOS_IPA_NAME: 'VK-Z-iOS.ipa'

jobs:
  build-android:
    name: 🤖 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout репозитория
        uses: actions/checkout@v4

      - name: ☕ Установка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🏗 Установка Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔧 Кэширование Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🏗 Установка Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: 📦 Сборка Universal APK (Debug)
        run: |
          cd android
          
          # Устанавливаем core ulimit (необходимо для Gradle)
          ulimit -c unlimited 2>/dev/null || true
          echo "core ulimit: $(ulimit -c)"
          
          export GRADLE_OPTS="-Dorg.gradle.internal.launcher.welcomeMessageEnabled=false -Dorg.gradle.jvmargs=-Xmx2048m"
          gradle assembleDebug --no-daemon 2>&1
        shell: bash

      - name: 📋 Поиск APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs -name "*.apk" -type f | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Найден APK: $APK_PATH"

      - name: 📤 Загрузка APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_OUTPUT_NAME }}
          path: ${{ steps.find_apk.outputs.APK_PATH }}
          if-no-files-found: error

  build-ios:
    name: 🍎 iOS IPA
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout репозитория
        uses: actions/checkout@v4

      - name: 🔍 Проверка Xcode и инструментов
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version

      - name: 🔧 Разрешение SPM зависимостей
        run: |
          cd VK-Z
          xcodebuild -resolvePackageDependencies \
            -project VKZ.xcodeproj \
            -scheme VKZ \
            -clonedSourcePackagesDirPath .build/spm-checkouts \
            2>&1 | tee resolve.log
          echo "✅ SPM зависимости разрешены"

      - name: 🏗 Архивация .xcarchive (Release)
        run: |
          cd VK-Z
          ARCHIVE_PATH="${{ runner.temp }}/VKZ.xcarchive"
          
          xcodebuild \
            -project VKZ.xcodeproj \
            -scheme VKZ \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -clonedSourcePackagesDirPath .build/spm-checkouts \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean archive \
            2>&1 | tee build.log
          
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ Архивация не удалась! Смотрим ошибки компиляции:"
            grep -n "error:" build.log | head -30
            echo ""
            echo "--- Последние 30 строк лога ---"
            tail -30 build.log
            exit 1
          fi
          echo "✅ Архивация завершена: $ARCHIVE_PATH"

      - name: 📦 Экспорт IPA (без подписи)
        run: |
          cd VK-Z
          ARCHIVE_PATH="${{ runner.temp }}/VKZ.xcarchive"
          EXPORT_PATH="${{ runner.temp }}/export"
          mkdir -p "$EXPORT_PATH"
          
          # Создаём plist для экспорта без подписи
          cat > "$EXPORT_PATH/export.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>-</string>
            <key>provisioningProfiles</key>
            <dict/>
            <key>compileBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <false/>
          </dict>
          </plist>
          EOF
          
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_PATH/export.plist" \
            -allowProvisioningUpdates \
            2>&1 | tee export.log
          
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ Экспорт IPA не удался! Смотрим лог:"
            tail -50 export.log
            echo ""
            echo "Пробуем альтернативный метод — ручная упаковка .app..."
            
            # Альтернатива: ищем .app в архиве и пакуем вручную
            APP_PATH=$(find "$ARCHIVE_PATH" -name "*.app" -type d | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "Найден .app: $APP_PATH"
              mkdir -p Payload
              cp -R "$APP_PATH" Payload/
              zip -r "${{ env.IOS_IPA_NAME }}" Payload/
              rm -rf Payload
              mv "${{ env.IOS_IPA_NAME }}" "$EXPORT_PATH/"
              echo "✅ IPA создан вручную: $EXPORT_PATH/${{ env.IOS_IPA_NAME }}"
            else
              echo "❌ .app не найден в архиве!"
              ls -la "$ARCHIVE_PATH/Products/Applications/" 2>/dev/null || echo "Нет Applications"
              exit 1
            fi
          fi
          
          echo "✅ IPA создан:"
          ls -la "$EXPORT_PATH/"*.ipa 2>/dev/null || ls -la "$EXPORT_PATH/"

      - name: 📤 Загрузка .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IOS_IPA_NAME }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

  create-release:
    name: 🏷 Создание релиза
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Скачать APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APK_OUTPUT_NAME }}
          path: release-artifacts

      - name: 📥 Скачать IPA
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.IOS_IPA_NAME }}
          path: release-artifacts

      - name: 📋 Список артефактов
        run: ls -la release-artifacts/

      - name: 🏷 Создание GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_name }}
          name: '${{ env.APP_NAME }} ${{ github.event.inputs.version_name }}'
          body: |
            ## ${{ env.APP_NAME }} ${{ github.event.inputs.version_name }}

            ${{ github.event.inputs.release_notes }}

            ### 📱 Платформы
            - **Android** — Universal APK (все архитектуры)
            - **iOS** — IPA для симулятора (без подписи)

            ---
            *Собрано: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}*
          files: release-artifacts/*
          prerelease: ${{ github.event.inputs.is_prerelease }}
          generate_release_notes: false

      - name: 📱 Отправка уведомления в Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          VERSION="${{ github.event.inputs.version_name }}"
          NOTES="${{ github.event.inputs.release_notes }}"
          PRERELEASE="${{ github.event.inputs.is_prerelease }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/$VERSION"

          if [ "$PRERELEASE" = "true" ]; then
            STATUS_ICON="🧪"
            STATUS_TEXT="Pre-release"
          else
            STATUS_ICON="✅"
            STATUS_TEXT="Stable"
          fi

          MESSAGE=$(cat <<-ENDMSG
          $STATUS_ICON <b>${{ env.APP_NAME }} $VERSION</b> ($STATUS_TEXT)
          
          📝 <b>Что нового:</b>
          $NOTES
          
          📱 <b>Платформы:</b>
          • Android — Universal APK
          • iOS — IPA (Alpha версия)
          
          🔗 <a href="$RELEASE_URL">Скачать релиз</a>
          ⚙ <a href="$RUN_URL">Сборка #${{ github.run_number }}</a>
          ENDMSG
          )

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" || echo "Telegram notification failed"
        shell: bash