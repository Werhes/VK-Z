name: 📱 VK-Z Build All (Android + iOS)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Название версии (например, v1.2.0)'
        required: true
        default: 'v1.0.0'
        type: string
      release_notes:
        description: 'Описание релиза (что нового)'
        required: true
        default: 'Исправления и улучшения'
        type: string
      is_prerelease:
        description: 'Pre-release (черновик)?'
        required: true
        default: true
        type: boolean

env:
  APP_NAME: 'VK-Z'
  APK_OUTPUT_NAME: 'VK-Z-Universal.apk'
  IOS_IPA_NAME: 'VK-Z-iOS.ipa'

jobs:
  build-android:
    name: 🤖 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout репозитория
        uses: actions/checkout@v4

      - name: ☕ Установка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🏗 Установка Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔧 Кэширование Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 📦 Сборка Universal APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        shell: bash

      - name: 📋 Поиск APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs -name "*.apk" -type f | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Найден APK: $APK_PATH"

      - name: 📤 Загрузка APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_OUTPUT_NAME }}
          path: ${{ steps.find_apk.outputs.APK_PATH }}
          if-no-files-found: error

  build-ios:
    name: 🍎 iOS IPA
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout репозитория
        uses: actions/checkout@v4

      - name: 📦 Генерация Xcode проекта из Package.swift
        run: |
          cd VK-Z
          swift package generate-xcodeproj
          echo "✅ Xcode проект создан"

      - name: 🔧 Определение схемы
        id: scheme
        run: |
          cd VK-Z
          SCHEME=$(xcodebuild -list 2>&1 | grep -E "^\s+${SCHEME_NAME}" | head -1 | xargs)
          if [ -z "$SCHEME" ]; then
            SCHEME=$(xcodebuild -list 2>&1 | grep -A 100 "Schemes:" | tail -n +2 | head -1 | xargs)
          fi
          echo "scheme=$SCHEME" >> $GITHUB_OUTPUT
          echo "Используем схему: $SCHEME"
        env:
          SCHEME_NAME: 'VKZ'

      - name: 🏗 Сборка .app
        run: |
          cd VK-Z
          xcodebuild build \
            -project *.xcodeproj \
            -scheme "${{ steps.scheme.outputs.scheme }}" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee build.log
          
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ Сборка не удалась!"
            exit 1
          fi

      - name: 📦 Упаковка в .ipa
        run: |
          cd VK-Z
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          echo "Найден .app: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ .app не найден!"
            exit 1
          fi
          
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r "${{ env.IOS_IPA_NAME }}" Payload/
          rm -rf Payload
          
          echo "✅ .ipa создан: ${{ env.IOS_IPA_NAME }}"

      - name: 📤 Загрузка .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IOS_IPA_NAME }}
          path: VK-Z/${{ env.IOS_IPA_NAME }}
          if-no-files-found: error

  create-release:
    name: 🏷 Создание релиза
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Скачать APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APK_OUTPUT_NAME }}
          path: release-artifacts

      - name: 📥 Скачать IPA
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.IOS_IPA_NAME }}
          path: release-artifacts

      - name: 📋 Список артефактов
        run: ls -la release-artifacts/

      - name: 🏷 Создание GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_name }}
          name: '${{ env.APP_NAME }} ${{ github.event.inputs.version_name }}'
          body: |
            ## ${{ env.APP_NAME }} ${{ github.event.inputs.version_name }}

            ${{ github.event.inputs.release_notes }}

            ### 📱 Платформы
            - **Android** — Universal APK (все архитектуры)
            - **iOS** — IPA для симулятора (без подписи)

            ---
            *Собрано: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}*
          files: release-artifacts/*
          prerelease: ${{ github.event.inputs.is_prerelease }}
          generate_release_notes: false

      - name: 📱 Отправка уведомления в Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          VERSION="${{ github.event.inputs.version_name }}"
          NOTES="${{ github.event.inputs.release_notes }}"
          PRERELEASE="${{ github.event.inputs.is_prerelease }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/$VERSION"

          if [ "$PRERELEASE" = "true" ]; then
            STATUS_ICON="🧪"
            STATUS_TEXT="Pre-release"
          else
            STATUS_ICON="✅"
            STATUS_TEXT="Stable"
          fi

          MESSAGE="$STATUS_ICON <b>${{ env.APP_NAME }} $VERSION</b> ($STATUS_TEXT)
          
          📝 <b>Что нового:</b>
          $NOTES
          
          📱 <b>Платформы:</b>
          • Android — Universal APK
          • iOS — IPA (симулятор)
          
          🔗 <a href=\"$RELEASE_URL\">Скачать релиз</a>
          ⚙ <a href=\"$RUN_URL\">Сборка #${{ github.run_number }}</a>"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" || echo "Telegram notification failed"
        shell: bash