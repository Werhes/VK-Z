name: 🍎 iOS Build & Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Название версии (например, v1.2.0)'
        required: true
        default: 'v1.0.0'
        type: string
      release_notes:
        description: 'Описание релиза (что нового)'
        required: true
        default: 'Исправления и улучшения'
        type: string
      is_prerelease:
        description: 'Pre-release (черновик)?'
        required: true
        default: true
        type: boolean

env:
  APP_NAME: 'VK-Z'
  IOS_IPA_NAME: 'VK-Z-iOS.ipa'

jobs:
  build-ios:
    name: 🔨 iOS IPA
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout репозитория
        uses: actions/checkout@v4

      - name: 🔍 Проверка Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: 🏗 Сборка .app через SPM
        run: |
          cd VK-Z
          swift build \
            -c debug \
            -Xswiftc "-sdk" -Xswiftc "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -Xswiftc "-target" -Xswiftc "x86_64-apple-ios17.0-simulator" \
            2>&1 | tee build.log
          
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ Сборка не удалась!"
            exit 1
          fi
          echo "✅ Сборка завершена"

      - name: 📦 Упаковка в .ipa
        run: |
          cd VK-Z
          APP_PATH=$(find .build -name "*.app" -type d | head -1)
          echo "Найден .app: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ .app не найден!"
            exit 1
          fi
          
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r "${{ env.IOS_IPA_NAME }}" Payload/
          rm -rf Payload
          
          echo "✅ .ipa создан: ${{ env.IOS_IPA_NAME }}"
          ls -la "${{ env.IOS_IPA_NAME }}"

      - name: 📤 Загрузка .ipa как артефакта
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IOS_IPA_NAME }}
          path: VK-Z/${{ env.IOS_IPA_NAME }}
          if-no-files-found: error

      - name: 🏷 Создание релиза на GitHub
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_name }}-ios
          name: '${{ env.APP_NAME }} ${{ github.event.inputs.version_name }} (iOS)'
          body: |
            ## ${{ env.APP_NAME }} ${{ github.event.inputs.version_name }} (iOS)

            ${{ github.event.inputs.release_notes }}

            > ⚠️ Сборка для симулятора (без подписи Apple Developer).
            > Для установки на реальное устройство требуется сертификат разработчика Apple.

            ---
            *Собрано: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}*
          files: VK-Z/${{ env.IOS_IPA_NAME }}
          prerelease: ${{ github.event.inputs.is_prerelease }}
          generate_release_notes: false

      - name: 📱 Отправка уведомления в Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          VERSION="${{ github.event.inputs.version_name }}"
          NOTES="${{ github.event.inputs.release_notes }}"
          PRERELEASE="${{ github.event.inputs.is_prerelease }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/$VERSION-ios"

          if [ "$PRERELEASE" = "true" ]; then
            STATUS_ICON="🧪"
            STATUS_TEXT="Pre-release"
          else
            STATUS_ICON="✅"
            STATUS_TEXT="Stable"
          fi

          MESSAGE="$STATUS_ICON <b>${{ env.APP_NAME }} $VERSION</b> ($STATUS_TEXT) 🍎 iOS
          
          📝 <b>Что нового:</b>
          $NOTES
          
          🔗 <a href=\"$RELEASE_URL\">Скачать релиз</a>
          ⚙ <a href=\"$RUN_URL\">Сборка #${{ github.run_number }}</a>"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" || echo "Telegram notification failed"
        shell: bash