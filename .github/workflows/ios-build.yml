name: 🍎 iOS Build & Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Название версии (например, v1.2.0)'
        required: true
        default: 'v1.0.0'
        type: string
      release_notes:
        description: 'Описание релиза (что нового)'
        required: true
        default: 'Исправления и улучшения'
        type: string
      is_prerelease:
        description: 'Pre-release (черновик)?'
        required: true
        default: true
        type: boolean

env:
  APP_NAME: 'VK-Z'
  SCHEME_NAME: 'VKZ'
  XCODE_PROJECT: 'VK-Z/VKZ.xcodeproj'
  IOS_APP_NAME: 'VK-Z-iOS.ipa'

jobs:
  build-ios:
    name: 🔨 iOS IPA
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout репозитория
        uses: actions/checkout@v4

      - name: 🔍 Проверка Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: 📦 Создание Xcode проекта из Package.swift
        run: |
          cd VK-Z
          # Генерируем xcodeproj из Package.swift
          swift package generate-xcodeproj
          echo "Создан Xcode проект"
          ls -la *.xcodeproj 2>/dev/null || echo "Нет xcodeproj"

      - name: 🔧 Настройка схемы для сборки
        run: |
          cd VK-Z
          # Создаём схему если её нет
          xcodebuild -list 2>&1 || true
          
          # Пробуем найти схему
          SCHEME=$(xcodebuild -list 2>&1 | grep -E "^[[:space:]]*${SCHEME_NAME}" | head -1 | xargs)
          if [ -z "$SCHEME" ]; then
            echo "Схема $SCHEME_NAME не найдена, создаём..."
            # Создаём схему через xcodebuild
            xcodebuild -project *.xcodeproj -scheme "$SCHEME_NAME" 2>&1 || true
          fi
          echo "Доступные схемы:"
          xcodebuild -list 2>&1 | grep -A 100 "Schemes:" || true

      - name: 🏗 Сборка iOS (Debug, без подписи)
        run: |
          cd VK-Z
          # Собираем для симулятора (без подписи)
          xcodebuild build \
            -project *.xcodeproj \
            -scheme "$SCHEME_NAME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee build.log
          
          # Проверяем успешность
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ Сборка не удалась!"
            exit 1
          fi
          echo "✅ Сборка завершена успешно"

      - name: 📤 Загрузка .app как артефакта
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-iOS.app
          path: |
            VK-Z/build/Debug-iphonesimulator/*.app
          if-no-files-found: warn

      - name: 🏷 Создание релиза на GitHub
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_name }}-ios
          name: '${{ env.APP_NAME }} ${{ github.event.inputs.version_name }} (iOS)'
          body: |
            ## ${{ env.APP_NAME }} ${{ github.event.inputs.version_name }} (iOS)

            ${{ github.event.inputs.release_notes }}

            > ⚠️ Сборка для симулятора (без подписи).
            > Для установки на устройство требуется подпись через Apple Developer Program.

            ---
            *Собрано: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}*
          prerelease: ${{ github.event.inputs.is_prerelease }}
          generate_release_notes: false

      - name: 📱 Отправка уведомления в Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          VERSION="${{ github.event.inputs.version_name }}"
          NOTES="${{ github.event.inputs.release_notes }}"
          PRERELEASE="${{ github.event.inputs.is_prerelease }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/$VERSION-ios"

          if [ "$PRERELEASE" = "true" ]; then
            STATUS_ICON="🧪"
            STATUS_TEXT="Pre-release"
          else
            STATUS_ICON="✅"
            STATUS_TEXT="Stable"
          fi

          MESSAGE="$STATUS_ICON <b>${{ env.APP_NAME }} $VERSION</b> ($STATUS_TEXT) 🍎 iOS
          
          📝 <b>Что нового:</b>
          $NOTES
          
          🔗 <a href=\"$RELEASE_URL\">Скачать релиз</a>
          ⚙ <a href=\"$RUN_URL\">Сборка #${{ github.run_number }}</a>"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" || echo "Telegram notification failed"
        shell: bash