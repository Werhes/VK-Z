name: VK Z Build & Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      namevers:
        description: "Название релиза"
        required: true
        type: string
      descr:
        description: "Описание релиза"
        required: false
        type: string
      release:
        description: "Выложить в релиз?"
        type: boolean
        default: false
      prerelease:
        description: "Создать как prerelease?"
        type: boolean
        default: false

env:
  PROJECT_NAME: "VK Z"
  RELEASE_NAME: ${{ github.event.inputs.namevers || github.ref_name }}
  RELEASE_DESCRIPTION: ${{ github.event.inputs.descr || 'Automated build' }}
  IS_RELEASE: ${{ github.event.inputs.release == 'true' || github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
  IS_PRERELEASE: ${{ github.event.inputs.prerelease == 'true' || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}

jobs:
  ios-build:
    name: iOS Build
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show Swift version
        run: swift --version

      - name: Resolve Swift Package dependencies
        run: |
          cd VK-Z
          swift package resolve

      - name: Build iOS project
        run: |
          cd VK-Z
          xcodebuild build \
            -scheme "VK-Z" \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.5' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO | xcpretty

      - name: Upload iOS build logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-logs
          path: ~/Library/Logs/DiagnosticReports/
          retention-days: 7

  android-build:
    name: Android Build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: vkz-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  create-release:
    name: Create Release
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
    needs: [ios-build, android-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: vkz-android-apk
          path: ./artifacts

      - name: Check if release already exists
        id: check_release
        run: |
          EXISTS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ env.RELEASE_NAME }}")
          echo "exists=$EXISTS" >> $GITHUB_OUTPUT
          if [ "$EXISTS" = "200" ]; then
            echo "Release with tag ${{ env.RELEASE_NAME }} already exists!"
          else
            echo "No existing release found, will create new one."
          fi

      - name: Generate release body
        id: release_body
        if: steps.check_release.outputs.exists != '200'
        run: |
          cat > release_body.md << 'EOF'
          ## ${{ env.PROJECT_NAME }} ${{ env.RELEASE_NAME }}

          ${{ env.RELEASE_DESCRIPTION }}

          ### Что нового:
          - iOS плеер для VK Музыки (SwiftUI)
          - Android плеер для VK Музыки (Kotlin + Jetpack Compose)
          - VK Микс — персональные подборки
          - Поиск треков и плейлистов
          - Фоновое воспроизведение
          - AirPlay / Media3 поддержка

          ### Файлы:
          - `VK-Z/` — исходный код iOS (Xcode project)
          - `android/` — исходный код Android (Gradle project)
          - `app-debug.apk` — Android APK для установки

          ### Требования:
          - iOS 17.0+ / Android 8.0+
          - Аккаунт ВКонтакте

          ---
          **Разработчик:** [Werhes](https://github.com/Werhes)
          EOF

          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat release_body.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists != '200'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_NAME }}
          name: ${{ env.PROJECT_NAME }} ${{ env.RELEASE_NAME }}
          body: ${{ steps.release_body.outputs.body }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          files: |
            ./artifacts/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-telegram:
    name: Telegram Notification
    if: github.event_name == 'workflow_dispatch' && always()
    needs: [ios-build, android-build, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            <b>🎵 ${{ env.PROJECT_NAME }} — CI/CD Report</b>

            <b>Branch:</b> <code>${{ github.ref_name }}</code>
            <b>Commit:</b> <a href="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}">${{ github.sha }}</a>
            <b>Author:</b> ${{ github.actor }}
            <b>Version:</b> ${{ env.RELEASE_NAME }}
            <b>Description:</b> ${{ env.RELEASE_DESCRIPTION }}

            <b>iOS Build:</b> ${{ needs.ios-build.result == 'success' && '✅ Success' || needs.ios-build.result == 'failure' && '❌ Failed' || '⏭️ Skipped' }}
            <b>Android Build:</b> ${{ needs.android-build.result == 'success' && '✅ Success' || needs.android-build.result == 'failure' && '❌ Failed' || '⏭️ Skipped' }}
            <b>Release:</b> ${{ needs.create-release.result == 'success' && '✅ Created' || needs.create-release.result == 'failure' && '❌ Failed' || '⏭️ Skipped' }}

            ${{ github.event.head_commit.message && format('<b>Message:</b> {0}', github.event.head_commit.message) || '' }}

            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">📋 Open Actions</a>