<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9"/>
      <stop offset="100%" style="stop-color:#357ABD"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- Music note -->
  <g transform="translate(128, 120)" fill="white">
    <!-- Note head -->
    <ellipse cx="60" cy="220" rx="35" ry="25" transform="rotate(-20, 60, 220)"/>
    <!-- Note stem -->
    <rect x="90" y="40" width="8" height="190" rx="4"/>
    <!-- Flag -->
    <path d="M98 40 Q140 60 160 100 Q140 80 98 80 Z"/>
    <!-- Second note head (smaller) -->
    <ellipse cx="160" cy="200" rx="28" ry="20" transform="rotate(-20, 160, 200)"/>
    <!-- Second note stem -->
    <rect x="184" y="60" width="7" height="150" rx="3.5"/>
    <!-- Second flag -->
    <path d="M191 60 Q225 75 240 110 Q225 92 191 92 Z"/>
  </g>
  <!-- Sound waves -->
  <g transform="translate(256, 256)" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.3">
    <path d="M-80,-80 Q-40,-120 0,-80 Q40,-40 80,-80"/>
    <path d="M-60,-60 Q-30,-90 0,-60 Q30,-30 60,-60"/>
  </g>
</svg>